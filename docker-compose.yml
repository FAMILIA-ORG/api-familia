version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: familia-mysql
    environment:
      MYSQL_DATABASE: db_familia
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: 
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Mailpit for email testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: familia-mailpit
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    volumes:
      - mailpit_data:/data

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familia-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_familia
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      APP_BASE_URL: http://localhost:8080
      APP_FRONTEND_URL: http://localhost:4200
      APP_JWT_SECRET: "KLcH9ZA3G847hhqQ54PmQXLndFScnVnxsdOkzimXr91ukuiQHAEc+30klWGp4jRxxYAMSnye1lmKxbMrc25ofg=="
      APP_JWT_EXPIRATION_SECONDS: "86400"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./src/main/resources/static/avatars:/app/src/main/resources/static/avatars
    restart: unless-stopped

volumes:
  mysql_data:
  mailpit_data:
